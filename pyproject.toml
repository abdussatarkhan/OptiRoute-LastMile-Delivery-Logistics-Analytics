[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optiroute_lastmile_delivery_logistics_analytics"
version = "1.0.0"
description = "Urban Last-Mile Courier Fleet Data Warehouse: First-Attempt Delivery Success Rate (FADR), stops-per-hour density, driver idle time fuel penalties, and geofence SLA tracking."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
